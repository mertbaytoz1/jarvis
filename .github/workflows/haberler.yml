name: Jarvis haberleri
on:
  schedule:
    - cron: '7 * * * *'      # saatte bir
  workflow_dispatch: {}       # elle çalıştırma düğmesi
permissions:
  contents: write
jobs:
  topla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python haber_topla.py news.json
      - name: Değiştiyse kaydet
        run: |
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Haberler güncellendi" && git push)
